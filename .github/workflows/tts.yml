name: tts
on:
  push:
    paths: ["jobs/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tts, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Render voice
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: python scripts/tts.py
      - name: Commit audio
        run: |
          git config user.name "media-bridge-bot"
          git config user.email "media-bridge-bot@users.noreply.github.com"
          git add out
          git diff --cached --quiet || (git commit -m "audio: render jobs" && git push)
