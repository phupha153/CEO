name: tts
on:
  push:
    paths: ["jobs/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tts, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -U edge-tts gTTS 2>&1 | tail -2
      - name: Google Translate voice (no key)
        run: python scripts/gtts_run.py > out/gtts_log.txt 2>&1 || true
      - name: Edge TTS (no key)
        run: |
          mkdir -p out
          python scripts/edge.py > out/edge_log.txt 2>&1 || echo "EXIT $?" >> out/edge_log.txt
          tail -30 out/edge_log.txt
      - name: Gemini TTS (only if GEMINI_API_KEY secret exists)
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        if: env.GEMINI_API_KEY != ''
        run: python scripts/tts.py > out/gemini_log.txt 2>&1 || true
      - name: Commit audio
        if: always()
        run: |
          git config user.name "media-bridge-bot"
          git config user.email "media-bridge-bot@users.noreply.github.com"
          git add out
          git diff --cached --quiet || (git commit -m "audio: render jobs" && git push)
