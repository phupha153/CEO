name: ai
on:
  push:
    paths: ["ai/jobs/**", "ai/in/**", "scripts/ai_run.py", ".github/workflows/ai.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ai, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests fal-client
      - name: Run AI jobs
        env:
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
          FAL_KEY: "${{ secrets.FAL_KEY }}"
        run: |
          mkdir -p ai/out
          python scripts/ai_run.py || true
          tail -40 ai/out/*_log.txt || true
      - name: Commit results
        if: always()
        run: |
          git config user.name "media-bridge-bot"
          git config user.email "media-bridge-bot@users.noreply.github.com"
          git add ai/out
          git diff --cached --quiet || (git commit -m "ai: results" && git pull --rebase -q && git push)
